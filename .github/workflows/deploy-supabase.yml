name: Publicar no Supabase

# Depois de cada merge na main: aplica as migrações novas e publica as Edge Functions.
# Precisa de 2 segredos no GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   (senha do banco do projeto)
# Sem eles, o workflow avisa e termina sem fazer nada.
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

env:
  PROJECT_REF: pbwkhfqggfpxjqrlqxyd

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Segredos configurados?
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN/SUPABASE_DB_PASSWORD não configurados; nada foi publicado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == 'true'
        with:
          version: latest

      - name: Ligar ao projeto
        if: steps.check.outputs.ok == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # As migrações deste repositório são idempotentes: aplicar de novo uma que já
      # foi rodada à mão no SQL Editor não quebra nada.
      - name: Migrações pendentes (prévia)
        if: steps.check.outputs.ok == 'true'
        run: supabase db push --dry-run --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Aplicar migrações
        if: steps.check.outputs.ok == 'true'
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Publicar Edge Functions
        if: steps.check.outputs.ok == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF"
